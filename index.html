<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modular Pong Arcade Engine</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0d0f17;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #e0e6ed;
      font-family: 'Consolas', 'Courier New', monospace;
      overflow: hidden;
    }
    header { text-align: center; margin-bottom: 8px; }
    h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: 3px;
      color: #00f0ff;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
    }
    .hud {
      display: flex;
      gap: 20px;
      margin-bottom: 6px;
      font-size: 13px;
    }
    .badge {
      background: #1a1e2d;
      padding: 3px 10px;
      border-radius: 4px;
      border: 1px solid #2d3548;
    }
    .badge span { color: #ff007f; font-weight: bold; }
    canvas {
      border: 2px solid #242b3d;
      border-radius: 6px;
      background: #121520;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.15);
    }
    .controls {
      display: flex;
      gap: 15px;
      margin-top: 10px;
      font-size: 12px;
      color: #7b88a1;
    }
    kbd {
      background: #242b3d;
      color: #fff;
      padding: 2px 6px;
      border-radius: 3px;
      border: 1px solid #3d4866;
    }
  </style>
</head>
<body>
  <header>
    <h1>RETRO PONG ENGINE</h1>
    <div class="hud">
      <div class="badge">Active Mode: <span id="modeName">CLASSIC</span></div>
      <div class="badge">Difficulty: <span id="speedMultiplier">1.0x</span></div>
    </div>
  </header>

  <canvas id="gameCanvas" width="800" height="500"></canvas>

  <div class="controls">
    <div><kbd>W</kbd> / <kbd>S</kbd> P1</div>
    <div><kbd>↑</kbd> / <kbd>↓</kbd> P2</div>
    <div><kbd>1</kbd> Classic | <kbd>2</kbd> Chaos | <kbd>3</kbd> Portal | <kbd>4</kbd> Wind</div>
    <div><kbd>Space</kbd> Start / Restart</div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const modeLabel = document.getElementById("modeName");
    const speedLabel = document.getElementById("speedMultiplier");

    const MODES = { 1: "CLASSIC", 2: "CHAOS", 3: "PORTAL", 4: "WIND" };
    let currentMode = "CLASSIC";

    // Engine entities
    const P_WIDTH = 14, P_HEIGHT = 85;
    let p1_y = 207, p2_y = 207;
    let pSpeed = 7;

    const B_SIZE = 12;
    let bx = 400, by = 250;
    let bvx = 5, bvy = 5;
    let baseSpeed = 5;
    let speedMult = 1.0;

    let score1 = 0, score2 = 0;
    const WIN_SCORE = 5;
    let gameState = "MENU"; // MENU, PLAYING, GAMEOVER
    let keys = {};
    let particles = [];

    // Portals
    const portals = {
      pA: { x: 400, y: 90, r: 20, target: { x: 400, y: 410 } },
      pB: { x: 400, y: 410, r: 20, target: { x: 400, y: 90 } }
    };
    let portalCooldown = 0;

    // Wind force vector
    let windVectorY = 0;
    let windTimer = 0;

    window.addEventListener("keydown", e => {
      keys[e.key.toLowerCase()] = true;

      if (e.code === "Space") {
        if (gameState === "MENU" || gameState === "GAMEOVER") {
          score1 = 0;
          score2 = 0;
          speedMult = 1.0;
          resetBall();
          gameState = "PLAYING";
        }
      }

      if (["1", "2", "3", "4"].includes(e.key)) {
        currentMode = MODES[e.key];
        modeLabel.innerText = currentMode;
        if (currentMode === "CHAOS") modeLabel.style.color = "#ffaa00";
        else if (currentMode === "PORTAL") modeLabel.style.color = "#a855f7";
        else if (currentMode === "WIND") modeLabel.style.color = "#38bdf8";
        else modeLabel.style.color = "#00f0ff";
      }
    });

    window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

    function resetBall() {
      bx = canvas.width / 2;
      by = canvas.height / 2;
      speedMult = 1.0;
      speedLabel.innerText = "1.0x";
      bvx = baseSpeed * (Math.random() > 0.5 ? 1 : -1);
      bvy = (Math.random() * 4 - 2);
      portalCooldown = 0;
    }

    function spawnHitParticles(x, y, color) {
      for (let i = 0; i < 8; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          life: 18,
          color
        });
      }
    }

    function update() {
      if (gameState !== "PLAYING") return;

      // Player 1 controls
      if (keys["w"] && p1_y > 0) p1_y -= pSpeed;
      if (keys["s"] && p1_y < canvas.height - P_HEIGHT) p1_y += pSpeed;

      // Player 2 controls / AI fallback
      if (keys["arrowup"] && p2_y > 0) p2_y -= pSpeed;
      else if (keys["arrowdown"] && p2_y < canvas.height - P_HEIGHT) p2_y += pSpeed;
      else {
        // AI smoothing
        let p2Center = p2_y + P_HEIGHT / 2;
        if (p2Center < by - 8) p2_y += Math.min(5.6, by - p2Center);
        else if (p2Center > by + 8) p2_y -= Math.min(5.6, p2Center - by);
        p2_y = Math.max(0, Math.min(canvas.height - P_HEIGHT, p2_y));
      }

      // Wind Mode Physics
      if (currentMode === "WIND") {
        windTimer++;
        if (windTimer > 120) {
          windVectorY = (Math.random() - 0.5) * 0.4;
          windTimer = 0;
        }
        bvy += windVectorY;
      }

      // Ball translation
      bx += bvx;
      by += bvy;

      // Portal Mode Physics
      if (currentMode === "PORTAL") {
        if (portalCooldown > 0) portalCooldown--;
        else {
          let distA = Math.hypot(bx - portals.pA.x, by - portals.pA.y);
          let distB = Math.hypot(bx - portals.pB.x, by - portals.pB.y);
          if (distA < portals.pA.r) {
            bx = portals.pA.target.x;
            by = portals.pA.target.y + (bvy > 0 ? 25 : -25);
            portalCooldown = 40;
            spawnHitParticles(bx, by, "#a855f7");
          } else if (distB < portals.pB.r) {
            bx = portals.pB.target.x;
            by = portals.pB.target.y + (bvy > 0 ? 25 : -25);
            portalCooldown = 40;
            spawnHitParticles(bx, by, "#a855f7");
          }
        }
      }

      // Top / Bottom wall bounds
      if (by <= 0) {
        by = 0;
        bvy *= -1;
        spawnHitParticles(bx, by, "#ffffff");
      } else if (by >= canvas.height - B_SIZE) {
        by = canvas.height - B_SIZE;
        bvy *= -1;
        spawnHitParticles(bx, by, "#ffffff");
      }

      // Paddle AABB Collision checks
      // Left Paddle
      if (bx <= 30 + P_WIDTH && bx >= 25 && by + B_SIZE >= p1_y && by <= p1_y + P_HEIGHT && bvx < 0) {
        speedMult = Math.min(2.5, speedMult * 1.07);
        speedLabel.innerText = speedMult.toFixed(1) + "x";
        bvx = Math.abs(bvx) * 1.07;
        let offset = (by + B_SIZE / 2) - (p1_y + P_HEIGHT / 2);
        bvy = offset * 0.18;

        if (currentMode === "CHAOS") bvy += (Math.random() - 0.5) * 5;
        spawnHitParticles(30 + P_WIDTH, by + B_SIZE / 2, "#00f0ff");
      }

      // Right Paddle
      if (bx + B_SIZE >= canvas.width - 30 - P_WIDTH && bx + B_SIZE <= canvas.width - 25 && by + B_SIZE >= p2_y && by <= p2_y + P_HEIGHT && bvx > 0) {
        speedMult = Math.min(2.5, speedMult * 1.07);
        speedLabel.innerText = speedMult.toFixed(1) + "x";
        bvx = -Math.abs(bvx) * 1.07;
        let offset = (by + B_SIZE / 2) - (p2_y + P_HEIGHT / 2);
        bvy = offset * 0.18;

        if (currentMode === "CHAOS") bvy += (Math.random() - 0.5) * 5;
        spawnHitParticles(canvas.width - 30 - P_WIDTH, by + B_SIZE / 2, "#ff007f");
      }

      // Goal detection
      if (bx < 0) {
        score2++;
        if (score2 >= WIN_SCORE) gameState = "GAMEOVER";
        else resetBall();
      } else if (bx > canvas.width) {
        score1++;
        if (score1 >= WIN_SCORE) gameState = "GAMEOVER";
        else resetBall();
      }

      // Particles lifecycle
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Court Midline
      ctx.strokeStyle = "#242b3d";
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Portal rendering
      if (currentMode === "PORTAL") {
        ctx.strokeStyle = "#a855f7";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(portals.pA.x, portals.pA.y, portals.pA.r, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = "#38bdf8";
        ctx.beginPath();
        ctx.arc(portals.pB.x, portals.pB.y, portals.pB.r, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Paddles
      ctx.fillStyle = "#00f0ff";
      ctx.fillRect(30, p1_y, P_WIDTH, P_HEIGHT);

      ctx.fillStyle = "#ff007f";
      ctx.fillRect(canvas.width - 30 - P_WIDTH, p2_y, P_WIDTH, P_HEIGHT);

      // Ball
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(bx, by, B_SIZE, B_SIZE);

      // Particles
      for (let p of particles) {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
      }

      // Score Display
      ctx.font = "bold 44px Consolas, monospace";
      ctx.fillStyle = "rgba(0, 240, 255, 0.4)";
      ctx.fillText(score1, 220, 65);
      ctx.fillStyle = "rgba(255, 0, 127, 0.4)";
      ctx.fillText(score2, 550, 65);

      // Overlays
      if (gameState === "MENU") {
        ctx.fillStyle = "rgba(13, 15, 23, 0.85)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.font = "bold 32px Consolas, monospace";
        ctx.fillStyle = "#00f0ff";
        ctx.textAlign = "center";
        ctx.fillText("READY TO PLAY", canvas.width / 2, 220);

        ctx.font = "16px Consolas, monospace";
        ctx.fillStyle = "#ffffff";
        ctx.fillText("Press [SPACEBAR] to Launch Match", canvas.width / 2, 270);
        ctx.fillText("Select Modes using [1], [2], [3], [4] on keyboard", canvas.width / 2, 305);
        ctx.textAlign = "start";
      } else if (gameState === "GAMEOVER") {
        ctx.fillStyle = "rgba(13, 15, 23, 0.85)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        let winMsg = score1 >= WIN_SCORE ? "PLAYER 1 WINS!" : "PLAYER 2 / AI WINS!";
        ctx.font = "bold 32px Consolas, monospace";
        ctx.fillStyle = score1 >= WIN_SCORE ? "#00f0ff" : "#ff007f";
        ctx.textAlign = "center";
        ctx.fillText(winMsg, canvas.width / 2, 220);

        ctx.font = "16px Consolas, monospace";
        ctx.fillStyle = "#ffffff";
        ctx.fillText("Press [SPACEBAR] to Restart Engine", canvas.width / 2, 280);
        ctx.textAlign = "start";
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }
    gameLoop();
  </script>
</body>
</html>
