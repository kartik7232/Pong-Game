<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Modular Pong Arcade Engine</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body {
      margin: 0;
      background: #0d0f17;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #e0e6ed;
      font-family: 'Consolas', 'Courier New', monospace;
      overflow: hidden;
    }
    header { text-align: center; margin-bottom: 4px; }
    h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 2px;
      color: #00f0ff;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    }
    .hud {
      display: flex;
      gap: 10px;
      margin-bottom: 4px;
      font-size: 11px;
    }
    .badge {
      background: #1a1e2d;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #2d3548;
    }
    .badge span { color: #ff007f; font-weight: bold; }
    canvas {
      border: 2px solid #242b3d;
      border-radius: 6px;
      background: #121520;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
      max-width: 95vw;
      height: auto;
      cursor: pointer;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-top: 6px;
      font-size: 10px;
      color: #7b88a1;
    }
    kbd {
      background: #242b3d;
      color: #fff;
      padding: 2px 4px;
      border-radius: 3px;
      border: 1px solid #3d4866;
    }
    .touch-controls {
      display: flex;
      width: 100%;
      max-width: 800px;
      justify-content: space-between;
      padding: 6px 15px;
      margin-top: 4px;
    }
    .touch-group { display: flex; gap: 10px; }
    .t-btn {
      background: #1a1e2d;
      color: #00f0ff;
      border: 1px solid #00f0ff;
      font-size: 14px;
      font-weight: bold;
      padding: 8px 16px;
      border-radius: 6px;
      outline: none;
      cursor: pointer;
      user-select: none;
    }
    .t-btn:active { background: #00f0ff; color: #121520; }
  </style>
</head>
<body>
  <header>
    <h1>RETRO PONG ENGINE</h1>
    <div class="hud">
      <div class="badge">Mode: <span id="modeName">CLASSIC</span></div>
      <div class="badge">Mult: <span id="speedMultiplier">1.0x</span></div>
    </div>
  </header>

  <canvas id="gameCanvas" width="800" height="450"></canvas>

  <div class="touch-controls">
    <div class="touch-group">
      <button class="t-btn" id="btnStart">SPACE / START</button>
      <button class="t-btn" id="btnTut">TUTORIAL</button>
    </div>
    <div class="touch-group">
      <button class="t-btn" style="border-color:#ff007f; color:#ff007f;" id="btnPause">PAUSE / ESC</button>
    </div>
  </div>

  <div class="controls">
    <div><kbd>Mouse / W/S</kbd> Move Paddle</div>
    <div><kbd>Click Menu Items</kbd> Choose Mode</div>
    <div><kbd>1-4 / ESC</kbd> Shortcuts</div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const modeLabel = document.getElementById("modeName");
    const speedLabel = document.getElementById("speedMultiplier");

    const MODES = { 
      1: { name: "CLASSIC", desc: "Standard arcade rules with speed ramping." }, 
      2: { name: "CHAOS", desc: "Unpredictable erratic ball deflection physics." }, 
      3: { name: "PORTAL", desc: "Teleporting spatial hoops across the court." }, 
      4: { name: "WIND", desc: "Dynamic vertical wind currents shifting trajectory." } 
    };
    
    let currentModeKey = 1;
    let currentModeName = "CLASSIC";

    const P_WIDTH = 14, P_HEIGHT = 75;
    let p1_y = 187, p2_y = 187, pSpeed = 7;
    const B_SIZE = 12;
    let bx = 400, by = 225, bvx = 5, bvy = 5, baseSpeed = 5, speedMult = 1.0;
    let score1 = 0, score2 = 0, WIN_SCORE = 5;
    
    let gameState = "MENU"; 
    let keys = {};
    let particles = [];
    let mouseControlActive = false;

    const portals = {
      pA: { x: 400, y: 80, r: 18, target: { x: 400, y: 370 } },
      pB: { x: 400, y: 370, r: 18, target: { x: 400, y: 80 } }
    };
    let portalCooldown = 0, windVectorY = 0, windTimer = 0;

    // Keyboard Listeners
    window.addEventListener("keydown", e => {
      keys[e.key.toLowerCase()] = true;
      if (e.key === "Escape") handleEscape();
      if (gameState === "MENU") {
        if (["1","2","3","4"].includes(e.key)) setMode(parseInt(e.key));
        if (e.key.toLowerCase() === "t") gameState = "TUTORIAL";
        if (e.code === "Space") startGame();
      } else if (gameState === "PAUSED" && e.code === "Space") {
        gameState = "PLAYING";
      } else if (gameState === "GAMEOVER" && (e.code === "Space" || e.key === "Escape")) {
        gameState = "MENU";
      }
    });
    window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

    // Mouse & Touch Interaction on Canvas
    canvas.addEventListener("mousemove", e => {
      mouseControlActive = true;
      let rect = canvas.getBoundingClientRect();
      let root = document.documentElement;
      let mouseY = e.clientY - rect.top - (canvas.clientHeight / 2 - canvas.height / 2); // account for scaling if any
      // Map mouse position directly to canvas coordinate space
      let scaleY = canvas.height / canvas.clientHeight;
      let canvasMouseY = (e.clientY - rect.top) * scaleY;
      p1_y = canvasMouseY - P_HEIGHT / 2;
      p1_y = Math.max(0, Math.min(canvas.height - P_HEIGHT, p1_y));
    });

    canvas.addEventListener("click", e => {
      let rect = canvas.getBoundingClientRect();
      let scaleX = canvas.width / canvas.clientWidth;
      let scaleY = canvas.height / canvas.clientHeight;
      let cx = (e.clientX - rect.left) * scaleX;
      let cy = (e.clientY - rect.top) * scaleY;

      if (gameState === "MENU") {
        let startY = 75;
        for (let key in MODES) {
          if (cx >= 80 && cx <= 720 && cy >= startY && cy <= startY + 42) {
            setMode(parseInt(key));
          }
          startY += 50;
        }
      }
    });

    function handleEscape() {
      if (gameState === "PLAYING") gameState = "PAUSED";
      else if (gameState === "PAUSED" || gameState === "TUTORIAL") gameState = "MENU";
      else if (gameState === "MENU") gameState = "TUTORIAL";
    }

    function startGame() {
      score1 = 0; score2 = 0; speedMult = 1.0;
      resetBall();
      gameState = "PLAYING";
    }

    function setMode(key) {
      currentModeKey = key;
      currentModeName = MODES[key].name;
      modeLabel.innerText = currentModeName;
    }

    // Button Event Bindings
    document.getElementById("btnPause").addEventListener("click", () => { handleEscape(); });
    document.getElementById("btnStart").addEventListener("click", () => {
      if (gameState === "MENU" || gameState === "GAMEOVER") startGame();
      else if (gameState === "PAUSED") gameState = "PLAYING";
    });
    document.getElementById("btnTut").addEventListener("click", () => {
      gameState = gameState === "TUTORIAL" ? "MENU" : "TUTORIAL";
    });

    function resetBall() {
      bx = canvas.width / 2; by = canvas.height / 2;
      speedMult = 1.0; speedLabel.innerText = "1.0x";
      bvx = baseSpeed * (Math.random() > 0.5 ? 1 : -1);
      bvy = (Math.random() * 4 - 2);
      portalCooldown = 0;
    }

    function spawnHitParticles(x, y, color) {
      for (let i = 0; i < 6; i++) {
        particles.push({
          x, y, vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5,
          life: 15, color
        });
      }
    }

    function update() {
      if (gameState !== "PLAYING") return;

      // Keyboard movement backup if mouse isn't moving
      if (!mouseControlActive) {
        if (keys["w"] && p1_y > 0) p1_y -= pSpeed;
        if (keys["s"] && p1_y < canvas.height - P_HEIGHT) p1_y += pSpeed;
      }
      mouseControlActive = false; // reset flag each frame

      // AI opponent tracking
      let p2Center = p2_y + P_HEIGHT / 2;
      if (p2Center < by - 6) p2_y += Math.min(5.4, by - p2Center);
      else if (p2Center > by + 6) p2_y -= Math.min(5.4, p2Center - by);
      p2_y = Math.max(0, Math.min(canvas.height - P_HEIGHT, p2_y));

      if (currentModeName === "WIND") {
        windTimer++;
        if (windTimer > 120) { windVectorY = (Math.random() - 0.5) * 0.4; windTimer = 0; }
        bvy += windVectorY;
      }

      bx += bvx; by += bvy;

      if (currentModeName === "PORTAL") {
        if (portalCooldown > 0) portalCooldown--;
        else {
          let distA = Math.hypot(bx - portals.pA.x, by - portals.pA.y);
          let distB = Math.hypot(bx - portals.pB.x, by - portals.pB.y);
          if (distA < portals.pA.r) {
            bx = portals.pA.target.x; by = portals.pA.target.y + (bvy > 0 ? 20 : -20);
            portalCooldown = 35; spawnHitParticles(bx, by, "#a855f7");
          } else if (distB < portals.pB.r) {
            bx = portals.pB.target.x; by = portals.pB.target.y + (bvy > 0 ? 20 : -20);
            portalCooldown = 35; spawnHitParticles(bx, by, "#a855f7");
          }
        }
      }

      if (by <= 0) { by = 0; bvy *= -1; spawnHitParticles(bx, by, "#fff"); }
      else if (by >= canvas.height - B_SIZE) { by = canvas.height - B_SIZE; bvy *= -1; spawnHitParticles(bx, by, "#fff"); }

      // Left Paddle Collision
      if (bx <= 30 + P_WIDTH && bx >= 25 && by + B_SIZE >= p1_y && by <= p1_y + P_HEIGHT && bvx < 0) {
        speedMult = Math.min(2.5, speedMult * 1.07);
        speedLabel.innerText = speedMult.toFixed(1) + "x";
        bvx = Math.abs(bvx) * 1.07;
        let offset = (by + B_SIZE / 2) - (p1_y + P_HEIGHT / 2);
        bvy = offset * 0.18;
        if (currentModeName === "CHAOS") bvy += (Math.random() - 0.5) * 5;
        spawnHitParticles(30 + P_WIDTH, by + B_SIZE / 2, "#00f0ff");
      }

      // Right Paddle Collision
      if (bx + B_SIZE >= canvas.width - 30 - P_WIDTH && bx + B_SIZE <= canvas.width - 25 && by + B_SIZE >= p2_y && by <= p2_y + P_HEIGHT && bvx > 0) {
        speedMult = Math.min(2.5, speedMult * 1.07);
        speedLabel.innerText = speedMult.toFixed(1) + "x";
        bvx = -Math.abs(bvx) * 1.07;
        let offset = (by + B_SIZE / 2) - (p2_y + P_HEIGHT / 2);
        bvy = offset * 0.18;
        if (currentModeName === "CHAOS") bvy += (Math.random() - 0.5) * 5;
        spawn
